name: Calculator CD

on:
  push:
    branches:
      - main

env:
  PROD_DIR: C:\Users\sboro\Desktop\CICDAssignment\Prod\CICDexample

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update production
        shell: cmd
        run: |
          git -C "%PROD_DIR%" fetch origin
          git -C "%PROD_DIR%" reset --hard origin/main

      - name: Run calculator
        shell: cmd
        run: python "%PROD_DIR%\main.py"